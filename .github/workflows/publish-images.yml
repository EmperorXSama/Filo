name: Publish Container Images
on:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish-api:
    name: Publish API image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set lowercase image owner
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Filo.Api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/filo-api:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/filo-api:${{ github.sha }}

  publish-ui:
    name: Publish ui image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set lowercase image owner
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ui image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Filo.Ui/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/filo-ui:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/filo-ui:${{ github.sha }}

  generate-migration-scripts:
    name: Generate migration SQL scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install EF tools
        run: dotnet tool install --global dotnet-ef

      - name: Generate forward (idempotent) script
        run: |
          dotnet ef migrations script \
            --idempotent \
            --output migrations/forward.sql \
            --project src/Filo.Infrastructure \
            --startup-project src/Filo.Api \
            --configuration Release

      - name: Generate rollback script
        run: |
          MIGRATIONS=$(dotnet ef migrations list \
            --project src/Filo.Infrastructure \
            --startup-project src/Filo.Api \
            --configuration Release)
          COUNT=$(echo "$MIGRATIONS" | wc -l)
          if [ "$COUNT" -eq 1 ]; then
            dotnet ef migrations script "$MIGRATIONS" 0 \
              --output migrations/rollback.sql \
              --project src/Filo.Infrastructure \
              --startup-project src/Filo.Api \
              --configuration Release
          else
            LATEST=$(echo "$MIGRATIONS" | tail -1)
            PREVIOUS=$(echo "$MIGRATIONS" | tail -2 | head -1)
            dotnet ef migrations script "$LATEST" "$PREVIOUS" \
              --output migrations/rollback.sql \
              --project src/Filo.Infrastructure \
              --startup-project src/Filo.Api \
              --configuration Release
          fi

      - name: Upload scripts as pipeline artifacts
        uses: actions/upload-artifact@v4
        with:
          name: migration-scripts
          path: migrations/
          retention-days: 1