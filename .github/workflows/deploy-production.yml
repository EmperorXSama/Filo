name: Deploy Production

on:
  workflow_run:
    workflows:
      - Publish Container Images
    types:
      - completed
    branches:
      - main

permissions:
  id-token: write
  contents: read
  actions: read

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: emperorxsama
  RESOURCE_GROUP: filo
  KEYVAULT_NAME: filo-kv

  API_APP_NAME: filo-api
  SPA_APP_NAME: filo-ui

jobs:
  apply-migration:
    name: Apply database migration
    runs-on: ubuntu-latest

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    environment:
      name: production

    steps:
      - uses: actions/checkout@v4

      - name: Download migration scripts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download ${{ github.event.workflow_run.id }} \
            --name migration-scripts \
            --dir migrations/

      - name: Log in to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get pipeline connection string from Key Vault
        id: get-conn
        run: |
          CONN=$(az keyvault secret show \
            --vault-name ${{ env.KEYVAULT_NAME }} \
            --name pipeline-db-connection-string \
            --query value -o tsv)
          echo "::add-mask::$CONN"
          echo "connection_string=$CONN" >> $GITHUB_OUTPUT

      - name: Parse connection string parts
        id: parse-conn
        run: |
          CS="${{ steps.get-conn.outputs.connection_string }}"
          echo "host=$(echo "$CS" | grep -oP '(?<=Host=)[^;]+')" >> $GITHUB_OUTPUT
          echo "port=$(echo "$CS" | grep -oP '(?<=Port=)[^;]+')" >> $GITHUB_OUTPUT
          echo "user=$(echo "$CS" | grep -oP '(?<=Username=)[^;]+')" >> $GITHUB_OUTPUT
          echo "dbname=$(echo "$CS" | grep -oP '(?<=Database=)[^;]+')" >> $GITHUB_OUTPUT
          echo "password=$(echo "$CS" | grep -oP '(?<=Password=)[^;]+')" >> $GITHUB_OUTPUT
          SSL=$(echo "$CS" | grep -oP '(?<=Ssl Mode=)[^;]+' | tr '[:upper:]' '[:lower:]')
          echo "sslmode=${SSL:-require}" >> $GITHUB_OUTPUT

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply forward migration script
        env:
          PGPASSWORD: ${{ steps.parse-conn.outputs.password }}
          PGSSLMODE: ${{ steps.parse-conn.outputs.sslmode }}
        run: |
          psql \
            -h "${{ steps.parse-conn.outputs.host }}" \
            -p "${{ steps.parse-conn.outputs.port }}" \
            -U "${{ steps.parse-conn.outputs.user }}" \
            -d "${{ steps.parse-conn.outputs.dbname }}" \
            -f migrations/forward.sql \
            -v ON_ERROR_STOP=1

  deploy-production:
    name: Deploy production Container Apps
    runs-on: ubuntu-latest

    needs: [apply-migration]

    steps:
      - name: Set image tag
        run: echo "IMAGE_TAG=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_ENV

      - name: Log in to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy API image to production
        uses: azure/container-apps-deploy-action@v2
        with:
          containerAppName: ${{ env.API_APP_NAME }}
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          imageToDeploy: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/filo-api:${{ env.IMAGE_TAG }}
          registryUrl: ${{ env.REGISTRY }}
          registryUsername: ${{ secrets.GHCR_USERNAME }}
          registryPassword: ${{ secrets.GHCR_TOKEN }}

      - name: Deploy SPA image to production
        uses: azure/container-apps-deploy-action@v2
        with:
          containerAppName: ${{ env.SPA_APP_NAME }}
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          imageToDeploy: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/filo-ui:${{ env.IMAGE_TAG }}
          registryUrl: ${{ env.REGISTRY }}
          registryUsername: ${{ secrets.GHCR_USERNAME }}
          registryPassword: ${{ secrets.GHCR_TOKEN }}