services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: Filo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: filo-api:local
    build:
      context: .
      dockerfile: src/filo.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      AppVersion: local-compose
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=Filo;Username=postgres;Password=postgres
    ports:
      - "5005:8080"
    depends_on:
      postgres:
        condition: service_healthy

  spa:
    image: filo-ui:local
    build:
      context: .
      dockerfile: src/Filo.Ui/Dockerfile
    environment:
      BFF_UPSTREAM: http://api:8080
    ports:
      - "8080:8080"
    depends_on:
      - api

volumes:
  postgres-data: