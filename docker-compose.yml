services:
  api:
    image: filo-api:local
    build:
      context: .
      dockerfile: src/filo.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      AppVersion: local-compose
    ports:
      - "5005:8080"

  spa:
    image: filo-ui:local
    build:
      context: .
      dockerfile: src/Filo.Ui/Dockerfile
      args:
        VITE_API_BASE_URL: ""
        VITE_APP_NAME: "Filo"
    environment:
      BFF_UPSTREAM: http://api:8080
    ports:
      - "8080:8080"
    depends_on:
      - api